<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 320" width="888" height="320">
  <rect x="0" y="0" width="888" height="320" fill="#f3f6f7"/>
<g font-family="IBM Plex Sans, sans-serif">
            <text x="20" y="18" font-size="12" font-weight="600" fill="#7b8d96" letter-spacing="1.4">CHẾ ĐỘ ĐƠN GIẢN · NHÓM “VĂN BẢN ĐẾN” · VAI TRÒ VĂN THƯ · 4 Ô</text>
            <g><rect x="20" y="32" width="200" height="84" rx="7" fill="#eef3f4" stroke="#b9c6cc"/><text x="36" y="70" font-size="26" font-weight="600" fill="#15232c">12</text><text x="36" y="94" font-size="13" fill="#4d5f6a">Chờ tiếp nhận</text></g>
            <g><rect x="236" y="32" width="200" height="84" rx="7" fill="#e0eeef" stroke="#0b6b74" stroke-width="2" stroke-dasharray="7 4"/><text x="252" y="70" font-size="26" font-weight="600" fill="#15232c">3</text><text x="252" y="94" font-size="13" fill="#4d5f6a">Chờ xử lý cá nhân</text><rect x="376" y="42" width="44" height="18" rx="9" fill="#0b6b74"/><text x="398" y="55" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing=".8">MỚI</text></g>
            <g><rect x="452" y="32" width="200" height="84" rx="7" fill="#f8ecd7" stroke="#8a5500" stroke-width="2"/><text x="468" y="70" font-size="26" font-weight="600" fill="#15232c">12</text><text x="468" y="94" font-size="13" fill="#4d5f6a">Chờ xử lý đơn vị</text><rect x="564" y="42" width="72" height="18" rx="9" fill="#8a5500"/><text x="600" y="55" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing=".8">ĐỔI NHÃN</text></g>
            <g><rect x="668" y="32" width="200" height="84" rx="7" fill="#eef3f4" stroke="#b9c6cc"/><text x="684" y="70" font-size="26" font-weight="600" fill="#15232c">1</text><text x="684" y="94" font-size="13" fill="#4d5f6a">Đề nghị trả lại</text></g>
            <text x="20" y="150" font-size="12" font-weight="600" fill="#7b8d96" letter-spacing="1.4">CHẾ ĐỘ ĐƠN GIẢN · VAI TRÒ KHÁC · 2 Ô</text>
            <g><rect x="20" y="164" width="200" height="84" rx="7" fill="#e0eeef" stroke="#0b6b74" stroke-width="2" stroke-dasharray="7 4"/><text x="36" y="202" font-size="26" font-weight="600" fill="#15232c">5</text><text x="36" y="226" font-size="13" fill="#4d5f6a">Chờ xử lý cá nhân</text><rect x="160" y="174" width="44" height="18" rx="9" fill="#0b6b74"/><text x="182" y="187" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing=".8">MỚI</text></g>
            <g><rect x="236" y="164" width="200" height="84" rx="7" fill="#eef3f4" stroke="#b9c6cc"/><text x="252" y="202" font-size="26" font-weight="600" fill="#15232c">0</text><text x="252" y="226" font-size="13" fill="#4d5f6a">Đề nghị trả lại</text></g>
            <g><rect x="452" y="164" width="416" height="84" rx="7" fill="none" stroke="#9b2c2c" stroke-width="1.5" stroke-dasharray="4 5"/>
            <text x="660" y="198" font-size="13" font-weight="600" fill="#9b2c2c" text-anchor="middle">Không có “Chờ tiếp nhận” và “Chờ xử lý đơn vị”</text>
            <text x="660" y="220" font-size="12" fill="#7b8d96" text-anchor="middle">hai ô này khai là chỉ dành cho văn thư</text></g>
          </g>
          <text x="20" y="276" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#4d5f6a">Chế độ đơn giản chỉ hiện 3 trong 9 ô của nhóm: Chờ tiếp nhận, Chờ xử lý, Đề nghị trả lại. Sáu ô còn lại không có ở chế độ này.</text>
          <text x="20" y="296" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#8a5500">Ở chế độ này hệ thống BỎ QUA bật / tắt của từng người và ẩn luôn nút Cấu hình trang chủ: ô đã tắt ở chế độ đầy đủ vẫn hiện ở đây.</text>
