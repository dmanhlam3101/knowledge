<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 372" width="888" height="372">
  <rect x="0" y="0" width="888" height="372" fill="#f3f6f7"/>
<text x="20" y="18" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#7b8d96" letter-spacing="1.4">TRANG CHỦ · VAI TRÒ VĂN THƯ · SAU KHI SỬA · 9 Ô</text>
          <g font-family="IBM Plex Sans, sans-serif">
            <g><rect x="20" y="32" width="200" height="84" rx="7" fill="#eef3f4" stroke="#b9c6cc"/><text x="36" y="70" font-size="26" font-weight="600" fill="#15232c">12</text><text x="36" y="94" font-size="13" fill="#4d5f6a">Chờ tiếp nhận</text></g>
            <g><rect x="236" y="32" width="200" height="84" rx="7" fill="#e0eeef" stroke="#0b6b74" stroke-width="2" stroke-dasharray="7 4"/><text x="252" y="70" font-size="26" font-weight="600" fill="#15232c">3</text><text x="252" y="94" font-size="13" fill="#4d5f6a">Chờ xử lý cá nhân</text><rect x="376" y="42" width="44" height="18" rx="9" fill="#0b6b74"/><text x="398" y="55" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing=".8">MỚI</text></g>
            <g><rect x="452" y="32" width="200" height="84" rx="7" fill="#f8ecd7" stroke="#8a5500" stroke-width="2"/><text x="468" y="70" font-size="26" font-weight="600" fill="#15232c">12</text><text x="468" y="94" font-size="13" fill="#4d5f6a">Chờ xử lý đơn vị</text><rect x="564" y="42" width="72" height="18" rx="9" fill="#8a5500"/><text x="600" y="55" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing=".8">ĐỔI NHÃN</text></g>
            <g><rect x="668" y="32" width="200" height="84" rx="7" fill="#eef3f4" stroke="#b9c6cc"/><text x="684" y="70" font-size="26" font-weight="600" fill="#15232c">4</text><text x="684" y="94" font-size="13" fill="#4d5f6a">Sắp đến hạn</text></g>
            <g><rect x="20" y="132" width="200" height="84" rx="7" fill="#eef3f4" stroke="#b9c6cc"/><text x="36" y="170" font-size="26" font-weight="600" fill="#15232c">2</text><text x="36" y="194" font-size="13" fill="#4d5f6a">Quá hạn</text></g>
            <g><rect x="236" y="132" width="200" height="84" rx="7" fill="#eef3f4" stroke="#b9c6cc"/><text x="252" y="170" font-size="26" font-weight="600" fill="#15232c">1</text><text x="252" y="194" font-size="13" fill="#4d5f6a">Đề nghị trả lại</text></g>
            <g><rect x="452" y="132" width="200" height="84" rx="7" fill="#eef3f4" stroke="#b9c6cc"/><text x="468" y="170" font-size="26" font-weight="600" fill="#15232c">28</text><text x="468" y="194" font-size="13" fill="#4d5f6a">Đã xử lý</text></g>
            <g><rect x="668" y="132" width="200" height="84" rx="7" fill="#eef3f4" stroke="#b9c6cc"/><text x="684" y="170" font-size="26" font-weight="600" fill="#15232c">26</text><text x="684" y="194" font-size="13" fill="#4d5f6a">Đã hoàn thành</text></g>
            <g><rect x="20" y="232" width="200" height="84" rx="7" fill="#eef3f4" stroke="#b9c6cc"/><text x="36" y="270" font-size="26" font-weight="600" fill="#15232c">5</text><text x="36" y="294" font-size="13" fill="#4d5f6a">Nhận để biết</text></g>
          </g>
          <text x="252" y="268" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#8a5500">Ô “Chờ xử lý đơn vị” chính là ô cũ, chỉ đổi nhãn.</text>
          <text x="252" y="286" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#0b6b74">Ô “Chờ xử lý cá nhân” mới là ô thêm mới.</text>
          <text x="20" y="348" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#4d5f6a">Số trên ô phải bằng đúng số dòng trong danh sách khi bấm vào. Mặc định văn thư thấy cả hai ô ở trạng thái bật.</text>
</svg>
