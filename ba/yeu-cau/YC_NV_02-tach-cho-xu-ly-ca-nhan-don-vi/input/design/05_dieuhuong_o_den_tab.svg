          <text x="20" y="302" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#4d5f6a">Người không phải văn thư không có hàng tab này: bấm ô cá nhân là mở thẳng danh sách như hiện nay.</text>
          <text x="20" y="320" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#4d5f6a">Sau khi mở, bộ lọc là bộ lọc mặc định của hộp việc, không mang theo gì từ trang chủ.</text>
