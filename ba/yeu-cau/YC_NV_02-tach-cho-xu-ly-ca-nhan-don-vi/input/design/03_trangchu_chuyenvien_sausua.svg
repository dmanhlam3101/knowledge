          <text x="20" y="252" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#4d5f6a">Ô “Nhận để biết” nằm ở hàng kế tiếp. Với vai trò này, số và hành vi giữ y như hiện tại, chỉ đổi nhãn ô.</text>
