          <text x="20" y="242" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#8a5500">Số 12 chỉ là văn bản của đơn vị. Ba văn bản gửi đích danh văn thư không được ô nào đếm, và bấm ô chỉ mở tab Văn bản đơn vị.</text>
