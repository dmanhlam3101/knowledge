<g font-family="IBM Plex Sans, sans-serif">
            <text x="20" y="18" font-size="12" font-weight="600" fill="#7b8d96" letter-spacing="1.4">VAI TRÒ VĂN THƯ</text>
            <rect x="20" y="30" width="400" height="236" rx="8" fill="#eef3f4" stroke="#b9c6cc"/>
            <text x="38" y="56" font-size="13" font-weight="600" fill="#15232c">Cấu hình trang chủ</text>
