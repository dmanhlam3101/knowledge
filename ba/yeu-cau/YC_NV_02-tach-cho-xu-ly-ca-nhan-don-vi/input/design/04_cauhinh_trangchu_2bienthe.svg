            <text x="486" y="56" font-size="13" font-weight="600" fill="#15232c">Cấu hình trang chủ</text>
            <line x1="468" y1="68" x2="868" y2="68" stroke="#b9c6cc"/>
            <text x="486" y="90" font-size="11.5" font-weight="600" fill="#7b8d96" letter-spacing="1">VĂN BẢN ĐẾN</text>
            <g><rect x="486" y="104" width="16" height="16" rx="3" fill="#0b6b74"/><path d="M489 112l3.4 3.4 6-6.6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="512" y="117" font-size="13" fill="#15232c">Chờ tiếp nhận</text></g>
            <g><rect x="486" y="134" width="16" height="16" rx="3" fill="#0b6b74"/><path d="M489 142l3.4 3.4 6-6.6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="512" y="147" font-size="13" font-weight="600" fill="#15232c">Chờ xử lý cá nhân</text></g>
            <g><rect x="486" y="164" width="330" height="26" rx="5" fill="none" stroke="#9b2c2c" stroke-dasharray="4 5"/><text x="651" y="181" font-size="12" fill="#9b2c2c" text-anchor="middle">Không có dòng “Chờ xử lý đơn vị”</text></g>
            <g opacity=".75"><rect x="486" y="200" width="16" height="16" rx="3" fill="#0b6b74"/><path d="M489 208l3.4 3.4 6-6.6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="512" y="213" font-size="13" fill="#4d5f6a">Sắp đến hạn · và các ô còn lại</text></g>
          </g>
          <text x="20" y="288" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#4d5f6a">Cả hai ô mặc định đang bật. Văn thư vào đây để TẮT bớt, không phải để bật lên.</text>
