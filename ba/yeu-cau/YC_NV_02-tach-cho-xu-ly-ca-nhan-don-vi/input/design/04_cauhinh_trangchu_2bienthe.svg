            <text x="38" y="90" font-size="11.5" font-weight="600" fill="#7b8d96" letter-spacing="1">VĂN BẢN ĐẾN</text>
            <g><rect x="38" y="104" width="16" height="16" rx="3" fill="#0b6b74"/><path d="M41 112l3.4 3.4 6-6.6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="64" y="117" font-size="13" fill="#15232c">Chờ tiếp nhận</text></g>
            <g><rect x="38" y="134" width="16" height="16" rx="3" fill="#0b6b74"/><path d="M41 142l3.4 3.4 6-6.6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="64" y="147" font-size="13" font-weight="600" fill="#15232c">Chờ xử lý cá nhân</text><rect x="196" y="134" width="44" height="17" rx="8.5" fill="#0b6b74"/><text x="218" y="146.5" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing=".8">MỚI</text></g>
            <g><rect x="38" y="164" width="16" height="16" rx="3" fill="#0b6b74"/><path d="M41 172l3.4 3.4 6-6.6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="64" y="177" font-size="13" font-weight="600" fill="#15232c">Chờ xử lý đơn vị</text><rect x="196" y="164" width="72" height="17" rx="8.5" fill="#8a5500"/><text x="232" y="176.5" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing=".8">ĐỔI NHÃN</text></g>
            <g opacity=".75"><rect x="38" y="194" width="16" height="16" rx="3" fill="#0b6b74"/><path d="M41 202l3.4 3.4 6-6.6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="64" y="207" font-size="13" fill="#4d5f6a">Sắp đến hạn</text></g>
            <g opacity=".75"><rect x="38" y="224" width="16" height="16" rx="3" fill="#0b6b74"/><path d="M41 232l3.4 3.4 6-6.6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="64" y="237" font-size="13" fill="#4d5f6a">Quá hạn · và các ô còn lại</text></g>

            <text x="468" y="18" font-size="12" font-weight="600" fill="#7b8d96" letter-spacing="1.4">VAI TRÒ KHÁC</text>
