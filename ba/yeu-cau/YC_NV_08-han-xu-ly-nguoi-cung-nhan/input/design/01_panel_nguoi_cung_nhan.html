  <text x="40" y="68" font-size="13.5" fill="#5b6472">Mô phỏng màn hình: hiện trạng và mong muốn. Dữ liệu trong ảnh là ví dụ minh họa.</text>

    <text x="51" y="710.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="70" y="710">Cột mới nằm giữa "Thời gian chuyển" và "Người chuyển". Mỗi dòng hiện hạn của chính người hoặc đơn vị ở dòng đó.</text>

    <circle cx="51" cy="736" r="10" fill="#1f6feb"/>
    <text x="51" y="740.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="70" y="740">Lãnh đạo không giao hạn cho người này thì ô để trống. Không ghi chữ thay thế, không lấy hạn của sổ văn bản đến.</text>

    <circle cx="51" cy="766" r="10" fill="#1f6feb"/>
    <text x="51" y="770.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="70" y="770">Dòng đã quá hạn vẫn hiện như dòng thường. Không tô đỏ, không gắn biểu tượng cảnh báo.</text>

  <g font-size="12.5" fill="#3a4553">
    <text x="40" y="806">Hai dòng đầu cùng một lần chuyển nên cùng hạn. Dòng 3 là lần chuyển khác nên hạn khác. Một văn bản có thể có nhiều hạn khác nhau.</text>
    <text x="40" y="832">Cột chỉ để xem. Không bấm được, không sửa hạn ở đây. Muốn đổi hạn thì chuyển lại văn bản như hiện nay.</text>
    <text x="40" y="858">Ai mở được danh sách này thì thấy cột, không phân biệt lãnh đạo, văn thư hay chuyên viên.</text>
    <text x="40" y="884">Hạn hiện dạng ngày tháng năm, không hiện giờ phút, khác với cột "Thời gian chuyển" bên cạnh.</text>

  <g font-size="12" fill="#4a5361">
    <text x="56" y="954">Giữ nguyên kiểu bảng và cỡ chữ của panel hiện tại, không thiết kế lại. Cột mới rộng vừa đủ cho một ngày dạng 10 ký tự.</text>
    <text x="56" y="976">Nội dung cột căn giữa, cùng màu chữ với các cột khác. Màu xanh trong ảnh chỉ để chỉ chỗ thêm mới, không dùng trên sản phẩm.</text>
    <text x="56" y="998">Bảng không được tràn ngang. Thiếu chỗ thì thu hẹp hai cột đơn vị vì đã có chú thích hiện đủ tên khi trỏ chuột.</text>
    <text x="56" y="1020">Vẽ thêm một trạng thái rỗng: mọi dòng không có hạn thì cột vẫn hiện, các ô trống hết.</text>
